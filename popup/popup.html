<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title data-i18n="popup.title">GoMining Helper</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="popup-container">
    <header>
      <h1>⛏ GoMining Companion</h1>
      <span id="status-dot" class="dot"></span>
    </header>

    <main>
      <p id="status-text" data-i18n="popup.statusLoading">Chargement…</p>

      <div class="lang-row">
        <label for="lang-select" data-i18n="popup.language">Langue</label>
        <select id="lang-select">
          <option value="auto" data-i18n-option="popup.langAuto">Auto (navigateur)</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>

      <section id="costs-section">
        <div id="costs-header">
          <span data-i18n="popup.costsTitle">⚙ Coûts d'upgrade</span>
          <button id="costs-toggle" class="toggle-btn">▼</button>
        </div>
        <div id="costs-panel" class="hidden">
          <div id="costs-grid"></div>
          <button id="costs-reset" class="reset-btn" data-i18n="popup.costsReset">Rétablir les défauts</button>
          <button id="recalculate-btn" class="recalc-btn hidden" data-i18n="popup.costsSave">Enregistrer</button>
        </div>
      </section>

      <section id="listener-section">
        <div id="listener-header">
          <span data-i18n="popup.listenerTitle">🎧 Écoute des upgrades</span>
        </div>
        <div class="listener-row">
          <label for="listener-eff" data-i18n="popup.listenerEff">Efficience</label>
          <select id="listener-eff">
            <option value="12">12 W/TH</option>
            <option value="15" selected>15 W/TH</option>
            <option value="20">20 W/TH</option>
          </select>
        </div>
        <div class="listener-row">
          <button id="listener-start" class="listener-btn listener-btn--start" data-i18n="popup.listenerStart">▶ Démarrer</button>
          <button id="listener-stop" class="listener-btn listener-btn--stop" disabled data-i18n="popup.listenerStop">⏹ Arrêter</button>
        </div>
        <p id="listener-status" class="listener-status" data-i18n="popup.listenerStatusIdle">En pause</p>
      </section>

      <button id="tools-btn" class="tools-btn" data-i18n="popup.toolsBtn">🛠 Ouvrir les outils</button>
    </main>
  </div>
  <script src="../common/i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
